name: Deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.agent/**'
      - '.claude/**'
      - 'docs/**'
      - 'terraform/**'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      - name: Ensure support database schema
        run: >-
          npx wrangler d1 execute healthy-person-emulator-db --remote
          --config wrangler.toml
          --file=drizzle/migrations/0006_add_support_messages.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure personal library database schema
        run: >-
          npx wrangler d1 execute healthy-person-emulator-db --remote
          --config wrangler.toml
          --file=drizzle/migrations/0007_add_user_library.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure library note timestamps
        run: |
          npx wrangler d1 execute healthy-person-emulator-db --remote --config wrangler.toml \
            --command "SELECT COUNT(*) AS present FROM pragma_table_info('user_library_entries') WHERE name='note_updated_at'" \
            --json > "$RUNNER_TEMP/library-note-schema.json"
          LIBRARY_NOTE_COLUMN=$(node -e '
            const present = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0]?.results?.[0]?.present;
            if (present !== 0 && present !== 1) throw new Error("Unexpected library schema result");
            console.log(present);
          ' "$RUNNER_TEMP/library-note-schema.json")
          if [ "$LIBRARY_NOTE_COLUMN" = "0" ]; then
            npx wrangler d1 execute healthy-person-emulator-db --remote --config wrangler.toml \
              --file=drizzle/migrations/0008_add_library_note_timestamp.sql
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to production
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
